<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mago Webinar Content Planner</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }
        @media (max-width: 1024px) {
            .calendar-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Apps Script Configuration
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwnAXtnYjxwx7n00C_n8otIPyFkOhlCo7HFB_fpF1VKrBmnMi4Ho5a4vavqTvSUERDt/exec';

        // Google Sheets Helper Functions via Apps Script
        const sheetsAPI = {
            async getIdeas() {
                const url = `${APPS_SCRIPT_URL}?action=getIdeas`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch ideas');
                
                const rows = await response.json();
                
                if (rows.length <= 1) return []; // No data or just headers
                
                // Convert rows to objects (skip header row)
                return rows.slice(1).map(row => ({
                    id: row[0] || '',
                    title: row[1] || '',
                    description: row[2] || '',
                    source: row[3] || '',
                    tags: row[4] ? JSON.parse(row[4]) : [],
                    notes: row[5] || '',
                    status: row[6] || 'idea',
                    createdAt: row[7] || new Date().toISOString(),
                    priority: row[8] || '',
                    updatedAt: row[9] || new Date().toISOString()
                })).filter(idea => idea.id); // Filter out empty rows
            },

            async saveIdeas(ideas) {
                // Prepare data with headers
                const headers = ['ID', 'Title', 'Description', 'Source', 'Tags', 'Notes', 'Status', 'CreatedAt', 'Priority', 'UpdatedAt'];
                const rows = ideas.map(idea => [
                    idea.id,
                    idea.title,
                    idea.description || '',
                    idea.source || '',
                    JSON.stringify(idea.tags || []),
                    idea.notes || '',
                    idea.status || 'idea',
                    idea.createdAt || new Date().toISOString(),
                    idea.priority || '',
                    new Date().toISOString()
                ]);

                const values = [headers, ...rows];
                
                const url = `${APPS_SCRIPT_URL}`;
                const formData = new URLSearchParams();
                formData.append('action', 'saveIdeas');
                formData.append('data', JSON.stringify(values));
                
                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Failed to save ideas');
                return await response.json();
            },

            async getWebinars() {
                const url = `${APPS_SCRIPT_URL}?action=getWebinars`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch webinars');
                
                const rows = await response.json();
                
                if (rows.length <= 1) return [];
                
                return rows.slice(1).map(row => ({
                    id: row[0] || '',
                    ideaId: row[1] || '',
                    date: row[2] || '',
                    title: row[3] || '',
                    isFlexible: row[4] === 'true'
                })).filter(webinar => webinar.id);
            },

            async saveWebinars(webinars) {
                const headers = ['ID', 'IdeaID', 'Date', 'Title', 'IsFlexible'];
                const rows = webinars.map(w => [
                    w.id,
                    w.ideaId,
                    w.date,
                    w.title,
                    w.isFlexible.toString()
                ]);

                const values = [headers, ...rows];
                
                const url = `${APPS_SCRIPT_URL}`;
                const formData = new URLSearchParams();
                formData.append('action', 'saveWebinars');
                formData.append('data', JSON.stringify(values));
                
                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Failed to save webinars');
                return await response.json();
            }
        };

        function App() {
            const [ideas, setIdeas] = useState([]);
            const [scheduledWebinars, setScheduledWebinars] = useState([]);
            const [currentView, setCurrentView] = useState('dashboard');
            const [selectedIdea, setSelectedIdea] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [isSaving, setIsSaving] = useState(false);
            const [lastSync, setLastSync] = useState(null);
            const [syncError, setSyncError] = useState(null);

            // Load data on mount
            useEffect(() => {
                loadData();
            }, []);

            const loadData = async () => {
                setIsLoading(true);
                setSyncError(null);
                try {
                    const [loadedIdeas, loadedWebinars] = await Promise.all([
                        sheetsAPI.getIdeas(),
                        sheetsAPI.getWebinars()
                    ]);
                    setIdeas(loadedIdeas);
                    setScheduledWebinars(loadedWebinars);
                    setLastSync(new Date());
                } catch (error) {
                    console.error('Error loading data:', error);
                    setSyncError('Failed to load data from Google Sheets. Check your connection.');
                } finally {
                    setIsLoading(false);
                }
            };

            const saveData = async (newIdeas, newWebinars) => {
                setIsSaving(true);
                setSyncError(null);
                try {
                    await Promise.all([
                        sheetsAPI.saveIdeas(newIdeas || ideas),
                        sheetsAPI.saveWebinars(newWebinars || scheduledWebinars)
                    ]);
                    setLastSync(new Date());
                } catch (error) {
                    console.error('Error saving data:', error);
                    setSyncError('Failed to save to Google Sheets. Your changes may not be saved.');
                } finally {
                    setIsSaving(false);
                }
            };

            const addIdea = (idea) => {
                const newIdea = {
                    ...idea,
                    id: Date.now().toString(),
                    createdAt: new Date().toISOString(),
                    status: 'idea'
                };
                const newIdeas = [newIdea, ...ideas];
                setIdeas(newIdeas);
                saveData(newIdeas, scheduledWebinars);
            };

            const updateIdea = (id, updates) => {
                const newIdeas = ideas.map(idea => 
                    idea.id === id ? { ...idea, ...updates } : idea
                );
                setIdeas(newIdeas);
                saveData(newIdeas, scheduledWebinars);
            };

            const deleteIdea = (id) => {
                if (confirm('Are you sure you want to delete this idea?')) {
                    const newIdeas = ideas.filter(idea => idea.id !== id);
                    setIdeas(newIdeas);
                    saveData(newIdeas, scheduledWebinars);
                    if (selectedIdea?.id === id) {
                        setSelectedIdea(null);
                    }
                }
            };

            const scheduleWebinar = (ideaId, date) => {
                const idea = ideas.find(i => i.id === ideaId);
                const newWebinar = {
                    id: Date.now().toString(),
                    ideaId,
                    date,
                    title: idea.title,
                    isFlexible: false
                };
                const newWebinars = [...scheduledWebinars, newWebinar];
                setScheduledWebinars(newWebinars);
                updateIdea(ideaId, { status: 'scheduled' });
                saveData(ideas, newWebinars);
            };

            const unscheduleWebinar = (webinarId) => {
                const webinar = scheduledWebinars.find(w => w.id === webinarId);
                if (webinar) {
                    updateIdea(webinar.ideaId, { status: 'developing' });
                }
                const newWebinars = scheduledWebinars.filter(w => w.id !== webinarId);
                setScheduledWebinars(newWebinars);
                saveData(ideas, newWebinars);
            };

            if (isLoading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <div className="text-2xl text-gray-600 mb-4">Loading from Google Sheets...</div>
                            <div className="text-sm text-gray-500">☁️ Syncing your content vault</div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-50 to-blue-50">
                    <Header 
                        currentView={currentView} 
                        setCurrentView={setCurrentView}
                        isSaving={isSaving}
                        lastSync={lastSync}
                        syncError={syncError}
                        onRefresh={loadData}
                    />
                    
                    <div className="max-w-7xl mx-auto px-4 py-8">
                        {syncError && (
                            <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center">
                                        <i className="fas fa-exclamation-triangle text-red-600 mr-3"></i>
                                        <span className="text-red-800">{syncError}</span>
                                    </div>
                                    <button
                                        onClick={loadData}
                                        className="text-red-600 hover:text-red-800 font-semibold"
                                    >
                                        Retry
                                    </button>
                                </div>
                            </div>
                        )}

                        {currentView === 'dashboard' && (
                            <Dashboard 
                                ideas={ideas} 
                                scheduledWebinars={scheduledWebinars}
                                setCurrentView={setCurrentView}
                                setSelectedIdea={setSelectedIdea}
                            />
                        )}
                        {currentView === 'quick-capture' && (
                            <QuickCapture onAdd={addIdea} setCurrentView={setCurrentView} />
                        )}
                        {currentView === 'brainstorm' && (
                            <BrainstormMode onAdd={addIdea} setCurrentView={setCurrentView} />
                        )}
                        {currentView === 'all-ideas' && (
                            <AllIdeas 
                                ideas={ideas} 
                                onSelect={(idea) => {
                                    setSelectedIdea(idea);
                                    setCurrentView('develop');
                                }}
                                onDelete={deleteIdea}
                            />
                        )}
                        {currentView === 'calendar' && (
                            <Calendar 
                                ideas={ideas}
                                scheduledWebinars={scheduledWebinars}
                                onSchedule={scheduleWebinar}
                                onUnschedule={unscheduleWebinar}
                            />
                        )}
                        {currentView === 'develop' && selectedIdea && (
                            <DevelopIdea 
                                idea={selectedIdea}
                                onUpdate={(updates) => updateIdea(selectedIdea.id, updates)}
                                onSchedule={(date) => {
                                    scheduleWebinar(selectedIdea.id, date);
                                    setCurrentView('calendar');
                                }}
                                onBack={() => setCurrentView('all-ideas')}
                            />
                        )}
                        {currentView === 'ai-generator' && (
                            <AIGenerator onAdd={addIdea} setCurrentView={setCurrentView} />
                        )}
                        {currentView === 'import' && (
                            <BulkImport onImport={(importedIdeas) => {
                                const newIdeas = importedIdeas.map((idea, index) => ({
                                    ...idea,
                                    id: Date.now().toString() + '-' + index,
                                    createdAt: new Date().toISOString(),
                                    status: 'idea'
                                }));
                                const allIdeas = [...newIdeas, ...ideas];
                                setIdeas(allIdeas);
                                saveData(allIdeas, scheduledWebinars);
                                alert(`Successfully imported ${importedIdeas.length} ideas!`);
                                setCurrentView('all-ideas');
                            }} setCurrentView={setCurrentView} />
                        )}
                    </div>
                </div>
            );
        }

        function Header({ currentView, setCurrentView, isSaving, lastSync, syncError, onRefresh }) {
            return (
                <header className="bg-gradient-to-r from-purple-600 to-blue-600 text-white shadow-lg">
                    <div className="max-w-7xl mx-auto px-4 py-6">
                        <div className="flex items-center justify-between">
                            <div>
                                <h1 className="text-3xl font-bold">🎩 Amazing Mago Content Planner</h1>
                                <p className="text-purple-100 mt-1">
                                    Monthly Mastery Webinar System
                                    {isSaving && <span className="ml-3">💾 Saving...</span>}
                                    {!isSaving && lastSync && (
                                        <span className="ml-3 text-sm">
                                            ☁️ Last synced: {lastSync.toLocaleTimeString()}
                                        </span>
                                    )}
                                </p>
                            </div>
                            <div className="flex gap-3">
                                <button
                                    onClick={onRefresh}
                                    className="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg font-semibold transition"
                                    title="Refresh from Google Sheets"
                                >
                                    <i className="fas fa-sync-alt"></i>
                                </button>
                                <button
                                    onClick={() => setCurrentView('dashboard')}
                                    className="bg-white text-purple-600 px-4 py-2 rounded-lg font-semibold hover:bg-purple-50 transition"
                                >
                                    Dashboard
                                </button>
                            </div>
                        </div>
                    </div>
                </header>
            );
        }

        function Dashboard({ ideas, scheduledWebinars, setCurrentView, setSelectedIdea }) {
            const stats = {
                total: ideas.length,
                ideas: ideas.filter(i => i.status === 'idea').length,
                developing: ideas.filter(i => i.status === 'developing').length,
                scheduled: scheduledWebinars.length,
                delivered: ideas.filter(i => i.status === 'delivered').length
            };

            const upcomingWebinars = scheduledWebinars
                .sort((a, b) => new Date(a.date) - new Date(b.date))
                .slice(0, 3);

            const recentIdeas = ideas.slice(0, 5);

            return (
                <div className="space-y-6">
                    {/* Stats */}
                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                        <StatCard title="Total Ideas" value={stats.total} icon="lightbulb" color="yellow" />
                        <StatCard title="Raw Ideas" value={stats.ideas} icon="star" color="blue" />
                        <StatCard title="Developing" value={stats.developing} icon="hammer" color="orange" />
                        <StatCard title="Scheduled" value={stats.scheduled} icon="calendar" color="green" />
                        <StatCard title="Delivered" value={stats.delivered} icon="check-circle" color="purple" />
                    </div>

                    {/* Quick Actions */}
                    <div className="bg-white rounded-xl shadow-md p-6">
                        <h2 className="text-2xl font-bold mb-4">Quick Actions</h2>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <ActionButton
                                icon="plus"
                                title="Quick Capture"
                                description="Jot down an idea fast"
                                onClick={() => setCurrentView('quick-capture')}
                                color="blue"
                            />
                            <ActionButton
                                icon="brain"
                                title="Guided Brainstorm"
                                description="Use proven prompts"
                                onClick={() => setCurrentView('brainstorm')}
                                color="purple"
                            />
                            <ActionButton
                                icon="robot"
                                title="AI Generator"
                                description="Let Claude help you"
                                onClick={() => setCurrentView('ai-generator')}
                                color="green"
                            />
                            <ActionButton
                                icon="file-import"
                                title="Bulk Import"
                                description="Load multiple ideas"
                                onClick={() => setCurrentView('import')}
                                color="orange"
                            />
                        </div>
                    </div>

                    {/* Two Column Layout */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Upcoming Webinars */}
                        <div className="bg-white rounded-xl shadow-md p-6">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-2xl font-bold">Next 3 Webinars</h2>
                                <button
                                    onClick={() => setCurrentView('calendar')}
                                    className="text-blue-600 hover:text-blue-700 font-semibold"
                                >
                                    View Calendar →
                                </button>
                            </div>
                            {upcomingWebinars.length === 0 ? (
                                <p className="text-gray-500 italic">No webinars scheduled yet</p>
                            ) : (
                                <div className="space-y-3">
                                    {upcomingWebinars.map(webinar => (
                                        <div key={webinar.id} className="border-l-4 border-green-500 pl-4 py-2">
                                            <div className="font-semibold">{webinar.title}</div>
                                            <div className="text-sm text-gray-600">
                                                {new Date(webinar.date).toLocaleDateString('en-US', { 
                                                    month: 'long', 
                                                    day: 'numeric', 
                                                    year: 'numeric' 
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Recent Ideas */}
                        <div className="bg-white rounded-xl shadow-md p-6">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-2xl font-bold">Recent Ideas</h2>
                                <button
                                    onClick={() => setCurrentView('all-ideas')}
                                    className="text-blue-600 hover:text-blue-700 font-semibold"
                                >
                                    View All →
                                </button>
                            </div>
                            {recentIdeas.length === 0 ? (
                                <p className="text-gray-500 italic">No ideas yet - start capturing!</p>
                            ) : (
                                <div className="space-y-3">
                                    {recentIdeas.map(idea => (
                                        <div 
                                            key={idea.id} 
                                            className="border-l-4 border-blue-500 pl-4 py-2 cursor-pointer hover:bg-gray-50 transition"
                                            onClick={() => {
                                                setSelectedIdea(idea);
                                                setCurrentView('develop');
                                            }}
                                        >
                                            <div className="font-semibold">{idea.title}</div>
                                            <div className="text-sm text-gray-600 flex gap-2 mt-1">
                                                {idea.tags?.map(tag => (
                                                    <span key={tag} className="bg-gray-200 px-2 py-0.5 rounded text-xs">
                                                        {tag}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function StatCard({ title, value, icon, color }) {
            const colors = {
                yellow: 'bg-yellow-100 text-yellow-600',
                blue: 'bg-blue-100 text-blue-600',
                orange: 'bg-orange-100 text-orange-600',
                green: 'bg-green-100 text-green-600',
                purple: 'bg-purple-100 text-purple-600'
            };

            return (
                <div className="bg-white rounded-xl shadow-md p-6">
                    <div className="flex items-center justify-between">
                        <div>
                            <div className="text-gray-600 text-sm">{title}</div>
                            <div className="text-3xl font-bold mt-1">{value}</div>
                        </div>
                        <div className={`w-12 h-12 rounded-full ${colors[color]} flex items-center justify-center`}>
                            <i className={`fas fa-${icon} text-xl`}></i>
                        </div>
                    </div>
                </div>
            );
        }

        function ActionButton({ icon, title, description, onClick, color }) {
            const colors = {
                blue: 'bg-blue-500 hover:bg-blue-600',
                purple: 'bg-purple-500 hover:bg-purple-600',
                green: 'bg-green-500 hover:bg-green-600',
                orange: 'bg-orange-500 hover:bg-orange-600'
            };

            return (
                <button
                    onClick={onClick}
                    className={`${colors[color]} text-white p-6 rounded-xl shadow-md hover:shadow-lg transition text-left`}
                >
                    <i className={`fas fa-${icon} text-3xl mb-3`}></i>
                    <div className="font-bold text-lg">{title}</div>
                    <div className="text-sm opacity-90 mt-1">{description}</div>
                </button>
            );
        }

        // Include all other component functions from the original app
        // (QuickCapture, BrainstormMode, AllIdeas, Calendar, DevelopIdea, AIGenerator, BulkImport)
        // For brevity, I'll include just the key ones that changed...

        function QuickCapture({ onAdd, setCurrentView }) {
            const [title, setTitle] = useState('');
            const [description, setDescription] = useState('');
            const [source, setSource] = useState('');
            const [tags, setTags] = useState([]);
            const [newTag, setNewTag] = useState('');

            const availableTags = [
                'Mago CRM',
                'Email Marketing',
                'SEO',
                'Google Ads',
                'Copywriting',
                'Show Booking',
                'Feature Release',
                'Sales',
                'Automation'
            ];

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!title.trim()) return;

                onAdd({
                    title: title.trim(),
                    description: description.trim(),
                    source,
                    tags,
                    notes: ''
                });

                setTitle('');
                setDescription('');
                setSource('');
                setTags([]);
                alert('Idea captured and synced to Google Sheets!');
            };

            const toggleTag = (tag) => {
                setTags(tags.includes(tag) ? tags.filter(t => t !== tag) : [...tags, tag]);
            };

            const addCustomTag = () => {
                if (newTag.trim() && !tags.includes(newTag.trim())) {
                    setTags([...tags, newTag.trim()]);
                    setNewTag('');
                }
            };

            return (
                <div className="max-w-3xl mx-auto">
                    <div className="bg-white rounded-xl shadow-lg p-8">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-3xl font-bold">⚡ Quick Capture</h2>
                            <button
                                onClick={() => setCurrentView('dashboard')}
                                className="text-gray-600 hover:text-gray-800"
                            >
                                <i className="fas fa-times text-2xl"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div>
                                <label className="block text-sm font-semibold mb-2">Webinar Title/Topic *</label>
                                <input
                                    type="text"
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    placeholder="e.g., How to boost email open rates with Mago"
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    required
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-semibold mb-2">Quick Description</label>
                                <textarea
                                    value={description}
                                    onChange={(e) => setDescription(e.target.value)}
                                    placeholder="What's this about? Key points to cover..."
                                    rows="4"
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-semibold mb-2">Where did this idea come from?</label>
                                <select
                                    value={source}
                                    onChange={(e) => setSource(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                >
                                    <option value="">Select source...</option>
                                    <option value="Inner Circle Question">Inner Circle Question</option>
                                    <option value="Support Ticket">Support Ticket</option>
                                    <option value="Aha Moment">Aha Moment</option>
                                    <option value="Feature Release">Feature Release</option>
                                    <option value="Student Feedback">Student Feedback</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-semibold mb-2">Tags</label>
                                <div className="flex flex-wrap gap-2 mb-3">
                                    {availableTags.map(tag => (
                                        <button
                                            key={tag}
                                            type="button"
                                            onClick={() => toggleTag(tag)}
                                            className={`px-3 py-1.5 rounded-full text-sm font-medium transition ${
                                                tags.includes(tag)
                                                    ? 'bg-blue-500 text-white'
                                                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                            }`}
                                        >
                                            {tag}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        value={newTag}
                                        onChange={(e) => setNewTag(e.target.value)}
                                        placeholder="Add custom tag..."
                                        className="flex-1 px-4 py-2 border border-gray-300 rounded-lg"
                                        onKeyPress={(e) => e.key === 'Enter' && (e.preventDefault(), addCustomTag())}
                                    />
                                    <button
                                        type="button"
                                        onClick={addCustomTag}
                                        className="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600"
                                    >
                                        Add
                                    </button>
                                </div>
                            </div>

                            <button
                                type="submit"
                                className="w-full bg-blue-600 text-white py-4 rounded-lg font-bold text-lg hover:bg-blue-700 transition"
                            >
                                💾 Capture & Sync to Google Sheets
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // Placeholder for other components - in production, include all components from original
        function BrainstormMode({ onAdd, setCurrentView }) {
            return <div className="text-center p-12">Brainstorm Mode - Coming Soon</div>;
        }

        function AllIdeas({ ideas, onSelect, onDelete }) {
            return (
                <div>
                    <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                        <h2 className="text-3xl font-bold mb-4">All Ideas ({ideas.length})</h2>
                    </div>
                    <div className="space-y-4">
                        {ideas.map(idea => (
                            <div key={idea.id} className="bg-white rounded-xl shadow-md p-6 hover:shadow-lg transition cursor-pointer" onClick={() => onSelect(idea)}>
                                <h3 className="text-xl font-bold">{idea.title}</h3>
                                <p className="text-gray-600 mt-2">{idea.description?.substring(0, 150)}...</p>
                                <div className="flex gap-2 mt-3">
                                    {idea.tags?.map(tag => (
                                        <span key={tag} className="bg-gray-200 px-3 py-1 rounded-full text-xs">{tag}</span>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function Calendar({ ideas, scheduledWebinars, onSchedule, onUnschedule }) {
            return <div className="text-center p-12">Calendar View - Coming Soon</div>;
        }

        function DevelopIdea({ idea, onUpdate, onSchedule, onBack }) {
            return <div className="text-center p-12">Develop Idea - Coming Soon</div>;
        }

        function AIGenerator({ onAdd, setCurrentView }) {
            return <div className="text-center p-12">AI Generator - Coming Soon</div>;
        }

        function BulkImport({ onImport, setCurrentView }) {
            const [jsonText, setJsonText] = useState('');
            const [error, setError] = useState('');
            const [preview, setPreview] = useState(null);

            const handlePaste = (text) => {
                setJsonText(text);
                setError('');
                
                try {
                    const data = JSON.parse(text);
                    const ideas = data.ideas || (Array.isArray(data) ? data : []);
                    
                    if (ideas.length === 0) {
                        setError('No ideas found in JSON');
                        return;
                    }
                    
                    setPreview({
                        count: ideas.length,
                        samples: ideas.slice(0, 5)
                    });
                } catch (e) {
                    setError('Invalid JSON format: ' + e.message);
                }
            };

            const handleImport = () => {
                try {
                    const data = JSON.parse(jsonText);
                    const ideas = data.ideas || (Array.isArray(data) ? data : []);
                    
                    const formattedIdeas = ideas.map(idea => ({
                        title: idea.title,
                        description: idea.description,
                        source: idea.source || 'Bulk Import',
                        tags: idea.tags || [],
                        notes: idea.priority ? `Priority: ${idea.priority}` : ''
                    }));
                    
                    onImport(formattedIdeas);
                } catch (e) {
                    setError('Import failed: ' + e.message);
                }
            };

            return (
                <div className="max-w-4xl mx-auto">
                    <div className="bg-white rounded-xl shadow-lg p-8">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-3xl font-bold">📥 Bulk Import Ideas</h2>
                            <button
                                onClick={() => setCurrentView('dashboard')}
                                className="text-gray-600 hover:text-gray-800"
                            >
                                <i className="fas fa-times text-2xl"></i>
                            </button>
                        </div>

                        <div className="mb-6">
                            <label className="block text-sm font-semibold mb-2">JSON Data</label>
                            <textarea
                                value={jsonText}
                                onChange={(e) => handlePaste(e.target.value)}
                                rows="12"
                                className="w-full px-4 py-3 border border-gray-300 rounded-lg font-mono text-sm"
                                placeholder="Paste your JSON here..."
                            />
                        </div>

                        {error && (
                            <div className="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700">
                                {error}
                            </div>
                        )}

                        {preview && (
                            <div className="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg">
                                <div className="font-bold text-green-800 mb-2">
                                    ✓ Ready to import {preview.count} ideas
                                </div>
                            </div>
                        )}

                        <button
                            onClick={handleImport}
                            disabled={!preview}
                            className="w-full bg-orange-600 text-white py-4 rounded-lg font-bold text-lg hover:bg-orange-700 transition disabled:opacity-50"
                        >
                            {preview ? `Import & Sync ${preview.count} Ideas` : 'Paste JSON to Preview'}
                        </button>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
