<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mago Webinar Content Planner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎩</text></svg>">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.svg">
    <meta name="theme-color" content="#7c3aed">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mago Planner">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }
        @media (max-width: 1024px) {
            .calendar-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Cloudflare API
        const API_URL = '/api';

        const sheetsAPI = {
            async getIdeas() {
                const response = await fetch(`${API_URL}?action=getIdeas`);
                if (!response.ok) throw new Error('Failed to fetch ideas');
                return await response.json();
            },

            async saveIdeas(ideas) {
                const formData = new URLSearchParams();
                formData.append('action', 'saveIdeas');
                formData.append('data', JSON.stringify(ideas));
                const response = await fetch(API_URL, { method: 'POST', body: formData });
                if (!response.ok) throw new Error('Failed to save ideas');
                return await response.json();
            },

            async getWebinars() {
                const response = await fetch(`${API_URL}?action=getWebinars`);
                if (!response.ok) throw new Error('Failed to fetch webinars');
                return await response.json();
            },

            async saveWebinars(webinars) {
                const formData = new URLSearchParams();
                formData.append('action', 'saveWebinars');
                formData.append('data', JSON.stringify(webinars));
                const response = await fetch(API_URL, { method: 'POST', body: formData });
                if (!response.ok) throw new Error('Failed to save webinars');
                return await response.json();
            },

            async getTags() {
                const response = await fetch(`${API_URL}?action=getTags`);
                if (!response.ok) throw new Error('Failed to fetch tags');
                return await response.json();
            },

            async saveTags(tags) {
                const formData = new URLSearchParams();
                formData.append('action', 'saveTags');
                formData.append('data', JSON.stringify(tags));
                const response = await fetch(API_URL, { method: 'POST', body: formData });
                if (!response.ok) throw new Error('Failed to save tags');
                return await response.json();
            }
        };

        // Default tags
        const DEFAULT_TAGS = [
            'Mago CRM',
            'Email Marketing',
            'SEO',
            'Google Ads',
            'Copywriting',
            'Show Booking',
            'Feature Release',
            'Sales',
            'Automation'
        ];

        function App() {
            const [ideas, setIdeas] = useState([]);
            const [scheduledWebinars, setScheduledWebinars] = useState([]);
            const [currentView, setCurrentView] = useState('dashboard');
            const [selectedIdea, setSelectedIdea] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [isSaving, setIsSaving] = useState(false);
            const [lastSync, setLastSync] = useState(null);
            const [syncError, setSyncError] = useState(null);
            const [availableTags, setAvailableTags] = useState(DEFAULT_TAGS);

            // Load data on mount
            useEffect(() => {
                loadData();
            }, []);

            const loadData = async () => {
                setIsLoading(true);
                setSyncError(null);
                try {
                    const [loadedIdeas, loadedWebinars, loadedTags] = await Promise.all([
                        sheetsAPI.getIdeas(),
                        sheetsAPI.getWebinars(),
                        sheetsAPI.getTags()
                    ]);
                    setIdeas(loadedIdeas);
                    setScheduledWebinars(loadedWebinars);
                    
                    // Combine saved tags with default tags and tags from ideas
                    const allTags = new Set([...DEFAULT_TAGS, ...loadedTags]);
                    loadedIdeas.forEach(idea => {
                        if (idea.tags) {
                            idea.tags.forEach(tag => allTags.add(tag));
                        }
                    });
                    const sortedTags = Array.from(allTags).sort();
                    setAvailableTags(sortedTags);
                    
                    setLastSync(new Date());
                } catch (error) {
                    console.error('Error loading data:', error);
                    setSyncError('Failed to load data. Check your connection.');
                } finally {
                    setIsLoading(false);
                }
            };

            const saveData = async (newIdeas, newWebinars, newTags) => {
                // Safety check: Don't save if ideas array is empty (prevents accidental wipes)
                const ideasToSave = newIdeas || ideas;
                if (ideasToSave.length === 0) {
                    console.warn('Refusing to save empty ideas array - this would wipe all data');
                    setSyncError('Safety check: Cannot save empty data. Please refresh and try again.');
                    return;
                }
                
                setIsSaving(true);
                setSyncError(null);
                try {
                    await Promise.all([
                        sheetsAPI.saveIdeas(ideasToSave),
                        sheetsAPI.saveWebinars(newWebinars || scheduledWebinars),
                        sheetsAPI.saveTags(newTags || availableTags)
                    ]);
                    setLastSync(new Date());
                } catch (error) {
                    console.error('Error saving data:', error);
                    setSyncError('Failed to save. Your changes may not be saved.');
                } finally {
                    setIsSaving(false);
                }
            };

            const addIdea = (idea) => {
                const newIdea = {
                    ...idea,
                    id: Date.now().toString(),
                    createdAt: new Date().toISOString(),
                    status: 'idea'
                };
                const newIdeas = [newIdea, ...ideas];
                setIdeas(newIdeas);
                
                // Update available tags
                let updatedTags = availableTags;
                if (idea.tags) {
                    const allTags = new Set(availableTags);
                    idea.tags.forEach(tag => allTags.add(tag));
                    updatedTags = Array.from(allTags).sort();
                    setAvailableTags(updatedTags);
                }
                
                saveData(newIdeas, scheduledWebinars, updatedTags);
            };

            const updateIdea = (id, updates) => {
                const newIdeas = ideas.map(idea => 
                    idea.id === id ? { ...idea, ...updates } : idea
                );
                setIdeas(newIdeas);
                
                // Update available tags if tags were changed
                let updatedTags = availableTags;
                if (updates.tags) {
                    const allTags = new Set(availableTags);
                    updates.tags.forEach(tag => allTags.add(tag));
                    updatedTags = Array.from(allTags).sort();
                    setAvailableTags(updatedTags);
                }
                
                saveData(newIdeas, scheduledWebinars, updatedTags);
            };

            const deleteIdea = (id) => {
                if (confirm('Are you sure you want to delete this idea?')) {
                    const newIdeas = ideas.filter(idea => idea.id !== id);
                    setIdeas(newIdeas);
                    saveData(newIdeas, scheduledWebinars);
                    if (selectedIdea?.id === id) {
                        setSelectedIdea(null);
                    }
                }
            };

            const scheduleWebinar = (ideaId, date) => {
                const idea = ideas.find(i => i.id === ideaId);
                const newWebinar = {
                    id: Date.now().toString(),
                    ideaId,
                    date,
                    title: idea.title,
                    isFlexible: false
                };
                const newWebinars = [...scheduledWebinars, newWebinar];
                setScheduledWebinars(newWebinars);
                
                const newIdeas = ideas.map(i => 
                    i.id === ideaId ? { ...i, status: 'scheduled' } : i
                );
                setIdeas(newIdeas);
                
                saveData(newIdeas, newWebinars);
            };

            const unscheduleWebinar = (webinarId) => {
                const webinar = scheduledWebinars.find(w => w.id === webinarId);
                if (webinar) {
                    const newIdeas = ideas.map(i =>
                        i.id === webinar.ideaId ? { ...i, status: 'developing' } : i
                    );
                    setIdeas(newIdeas);
                }
                const newWebinars = scheduledWebinars.filter(w => w.id !== webinarId);
                setScheduledWebinars(newWebinars);
                saveData(ideas, newWebinars);
            };

            const deleteTag = (tagToDelete) => {
                if (confirm(`Remove "${tagToDelete}" from all ideas? This cannot be undone.`)) {
                    // Remove tag from all ideas
                    const newIdeas = ideas.map(idea => ({
                        ...idea,
                        tags: idea.tags ? idea.tags.filter(t => t !== tagToDelete) : []
                    }));
                    setIdeas(newIdeas);
                    
                    // Remove from available tags
                    const updatedTags = availableTags.filter(t => t !== tagToDelete);
                    setAvailableTags(updatedTags);
                    
                    saveData(newIdeas, scheduledWebinars, updatedTags);
                }
            };

            if (isLoading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <div className="text-2xl text-gray-600 mb-4">Loading your content...</div>
                            <div className="text-sm text-gray-500">☁️ Syncing with Cloudflare</div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-50 to-blue-50">
                    <Header
                        currentView={currentView}
                        setCurrentView={setCurrentView}
                        isSaving={isSaving}
                        lastSync={lastSync}
                        syncError={syncError}
                    />
                    
                    <div className="max-w-7xl mx-auto px-4 py-8">
                        {syncError && (
                            <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center">
                                        <i className="fas fa-exclamation-triangle text-red-600 mr-3"></i>
                                        <span className="text-red-800">{syncError}</span>
                                    </div>
                                    <button
                                        onClick={loadData}
                                        className="text-red-600 hover:text-red-800 font-semibold"
                                    >
                                        Retry
                                    </button>
                                </div>
                            </div>
                        )}

                        {currentView === 'dashboard' && (
                            <Dashboard 
                                ideas={ideas} 
                                scheduledWebinars={scheduledWebinars}
                                setCurrentView={setCurrentView}
                                setSelectedIdea={setSelectedIdea}
                            />
                        )}
                        {currentView === 'quick-capture' && (
                            <QuickCapture 
                                onAdd={addIdea} 
                                setCurrentView={setCurrentView}
                                availableTags={availableTags}
                            />
                        )}
                        {currentView === 'all-ideas' && (
                            <AllIdeas 
                                ideas={ideas} 
                                availableTags={availableTags}
                                onSelect={(idea) => {
                                    setSelectedIdea(idea);
                                    setCurrentView('develop');
                                }}
                                onDelete={deleteIdea}
                            />
                        )}
                        {currentView === 'calendar' && (
                            <Calendar 
                                ideas={ideas}
                                scheduledWebinars={scheduledWebinars}
                                onSchedule={scheduleWebinar}
                                onUnschedule={unscheduleWebinar}
                            />
                        )}
                        {currentView === 'develop' && selectedIdea && (
                            <DevelopIdea 
                                idea={selectedIdea}
                                availableTags={availableTags}
                                onUpdate={(updates) => updateIdea(selectedIdea.id, updates)}
                                onSchedule={(date) => {
                                    scheduleWebinar(selectedIdea.id, date);
                                    setCurrentView('calendar');
                                }}
                                onBack={() => {
                                    if (window.deleteCurrentIdea) {
                                        deleteIdea(selectedIdea.id);
                                        window.deleteCurrentIdea = false;
                                    }
                                    setCurrentView('all-ideas');
                                }}
                            />
                        )}
                        {currentView === 'ai-generator' && (
                            <AIGenerator 
                                onAdd={addIdea} 
                                setCurrentView={setCurrentView}
                                availableTags={availableTags}
                            />
                        )}
                        {currentView === 'import' && (
                            <BulkImport onImport={(importedIdeas) => {
                                const newIdeas = importedIdeas.map((idea, index) => ({
                                    ...idea,
                                    id: Date.now().toString() + '-' + index,
                                    createdAt: new Date().toISOString(),
                                    status: 'idea'
                                }));
                                const allIdeas = [...newIdeas, ...ideas];
                                setIdeas(allIdeas);
                                saveData(allIdeas, scheduledWebinars);
                                alert(`Successfully imported ${importedIdeas.length} ideas!`);
                                setCurrentView('all-ideas');
                            }} setCurrentView={setCurrentView} />
                        )}
                        {currentView === 'manage-tags' && (
                            <ManageTags
                                availableTags={availableTags}
                                onDeleteTag={deleteTag}
                                onAddTag={(newTag) => {
                                    if (!availableTags.includes(newTag)) {
                                        const updatedTags = [...availableTags, newTag].sort();
                                        setAvailableTags(updatedTags);
                                        saveData(ideas, scheduledWebinars, updatedTags);
                                    }
                                }}
                                setCurrentView={setCurrentView}
                            />
                        )}
                        {currentView === 'migrate' && (
                            <MigrateFromSheets
                                onMigrate={(migratedIdeas, migratedWebinars, migratedTags) => {
                                    setIdeas(migratedIdeas);
                                    setScheduledWebinars(migratedWebinars);
                                    const allTags = new Set([...DEFAULT_TAGS, ...migratedTags]);
                                    migratedIdeas.forEach(idea => idea.tags?.forEach(t => allTags.add(t)));
                                    setAvailableTags(Array.from(allTags).sort());
                                    setLastSync(new Date());
                                }}
                                setCurrentView={setCurrentView}
                            />
                        )}
                    </div>
                </div>
            );
        }

        function Header({ currentView, setCurrentView, isSaving, lastSync, syncError }) {
            return (
                <header className="bg-gradient-to-r from-purple-600 to-blue-600 text-white shadow-lg">
                    <div className="max-w-7xl mx-auto px-4 py-6">
                        <div className="flex items-center justify-between">
                            <div>
                                <h1 className="text-3xl font-bold">🎩 Amazing Mago Content Planner</h1>
                                <p className="text-purple-100 mt-1">
                                    Monthly Mastery Webinar System
                                    {isSaving && <span className="ml-3">💾 Saving...</span>}
                                    {!isSaving && lastSync && (
                                        <span className="ml-3 text-sm">
                                            ☁️ Last synced: {lastSync.toLocaleTimeString()}
                                        </span>
                                    )}
                                </p>
                            </div>
                            <div className="flex gap-3">
                                <button
                                    onClick={() => setCurrentView('dashboard')}
                                    className="bg-white text-purple-600 px-4 py-2 rounded-lg font-semibold hover:bg-purple-50 transition"
                                >
                                    Dashboard
                                </button>
                            </div>
                        </div>
                    </div>
                </header>
            );
        }

        function Dashboard({ ideas, scheduledWebinars, setCurrentView, setSelectedIdea }) {
            const stats = {
                total: ideas.length,
                ideas: ideas.filter(i => i.status === 'idea').length,
                developing: ideas.filter(i => i.status === 'developing').length,
                scheduled: scheduledWebinars.length,
                delivered: ideas.filter(i => i.status === 'delivered').length
            };

            const upcomingWebinars = scheduledWebinars
                .sort((a, b) => new Date(a.date) - new Date(b.date))
                .slice(0, 3);

            const recentIdeas = ideas.slice(0, 5);

            return (
                <div className="space-y-6">
                    {/* Stats */}
                    <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                        <StatCard title="Total Ideas" value={stats.total} icon="lightbulb" color="yellow" />
                        <StatCard title="Raw Ideas" value={stats.ideas} icon="star" color="blue" />
                        <StatCard title="Developing" value={stats.developing} icon="hammer" color="orange" />
                        <StatCard title="Scheduled" value={stats.scheduled} icon="calendar" color="green" />
                        <StatCard title="Delivered" value={stats.delivered} icon="check-circle" color="purple" />
                    </div>

                    {/* Quick Actions */}
                    <div className="bg-white rounded-xl shadow-md p-6">
                        <h2 className="text-2xl font-bold mb-4">Quick Actions</h2>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <ActionButton
                                icon="plus"
                                title="Quick Capture"
                                description="Jot down an idea fast"
                                onClick={() => setCurrentView('quick-capture')}
                                color="blue"
                            />
                            <ActionButton
                                icon="robot"
                                title="AI Generator"
                                description="Let Claude help you"
                                onClick={() => setCurrentView('ai-generator')}
                                color="green"
                            />
                            <ActionButton
                                icon="file-import"
                                title="Bulk Import"
                                description="Load multiple ideas"
                                onClick={() => setCurrentView('import')}
                                color="orange"
                            />
                            <ActionButton
                                icon="tags"
                                title="Manage Tags"
                                description="Add or remove tags"
                                onClick={() => setCurrentView('manage-tags')}
                                color="purple"
                            />
                        </div>
                    </div>

                    {/* Two Column Layout */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Upcoming Webinars */}
                        <div className="bg-white rounded-xl shadow-md p-6">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-2xl font-bold">Next 3 Webinars</h2>
                                <button
                                    onClick={() => setCurrentView('calendar')}
                                    className="text-blue-600 hover:text-blue-700 font-semibold"
                                >
                                    View Calendar →
                                </button>
                            </div>
                            {upcomingWebinars.length === 0 ? (
                                <p className="text-gray-500 italic">No webinars scheduled yet</p>
                            ) : (
                                <div className="space-y-3">
                                    {upcomingWebinars.map(webinar => (
                                        <div key={webinar.id} className="border-l-4 border-green-500 pl-4 py-2">
                                            <div className="font-semibold">{webinar.title}</div>
                                            <div className="text-sm text-gray-600">
                                                {new Date(webinar.date).toLocaleDateString('en-US', { 
                                                    month: 'long', 
                                                    day: 'numeric', 
                                                    year: 'numeric' 
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Recent Ideas */}
                        <div className="bg-white rounded-xl shadow-md p-6">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-2xl font-bold">Recent Ideas</h2>
                                <button
                                    onClick={() => setCurrentView('all-ideas')}
                                    className="text-blue-600 hover:text-blue-700 font-semibold"
                                >
                                    View All →
                                </button>
                            </div>
                            {recentIdeas.length === 0 ? (
                                <p className="text-gray-500 italic">No ideas yet - start capturing!</p>
                            ) : (
                                <div className="space-y-3">
                                    {recentIdeas.map(idea => (
                                        <div 
                                            key={idea.id} 
                                            className="border-l-4 border-blue-500 pl-4 py-2 cursor-pointer hover:bg-gray-50 transition"
                                            onClick={() => {
                                                setSelectedIdea(idea);
                                                setCurrentView('develop');
                                            }}
                                        >
                                            <div className="font-semibold">{idea.title}</div>
                                            <div className="text-sm text-gray-600 flex gap-2 mt-1">
                                                {idea.tags?.map(tag => (
                                                    <span key={tag} className="bg-gray-200 px-2 py-0.5 rounded text-xs">
                                                        {tag}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function StatCard({ title, value, icon, color }) {
            const colors = {
                yellow: 'bg-yellow-100 text-yellow-600',
                blue: 'bg-blue-100 text-blue-600',
                orange: 'bg-orange-100 text-orange-600',
                green: 'bg-green-100 text-green-600',
                purple: 'bg-purple-100 text-purple-600'
            };

            return (
                <div className="bg-white rounded-xl shadow-md p-6">
                    <div className="flex items-center justify-between">
                        <div>
                            <div className="text-gray-600 text-sm">{title}</div>
                            <div className="text-3xl font-bold mt-1">{value}</div>
                        </div>
                        <div className={`w-12 h-12 rounded-full ${colors[color]} flex items-center justify-center`}>
                            <i className={`fas fa-${icon} text-xl`}></i>
                        </div>
                    </div>
                </div>
            );
        }

        function ActionButton({ icon, title, description, onClick, color }) {
            const colors = {
                blue: 'bg-blue-500 hover:bg-blue-600',
                purple: 'bg-purple-500 hover:bg-purple-600',
                green: 'bg-green-500 hover:bg-green-600',
                orange: 'bg-orange-500 hover:bg-orange-600',
                gray: 'bg-gray-500 hover:bg-gray-600'
            };

            return (
                <button
                    onClick={onClick}
                    className={`${colors[color]} text-white p-6 rounded-xl shadow-md hover:shadow-lg transition text-left`}
                >
                    <i className={`fas fa-${icon} text-3xl mb-3`}></i>
                    <div className="font-bold text-lg">{title}</div>
                    <div className="text-sm opacity-90 mt-1">{description}</div>
                </button>
            );
        }

        function QuickCapture({ onAdd, setCurrentView, availableTags }) {
            const [title, setTitle] = useState('');
            const [description, setDescription] = useState('');
            const [source, setSource] = useState('');
            const [tags, setTags] = useState([]);
            const [newTag, setNewTag] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!title.trim()) return;

                onAdd({
                    title: title.trim(),
                    description: description.trim(),
                    source,
                    tags,
                    notes: ''
                });

                setTitle('');
                setDescription('');
                setSource('');
                setTags([]);
                alert('Idea captured and saved!');
            };

            const toggleTag = (tag) => {
                setTags(tags.includes(tag) ? tags.filter(t => t !== tag) : [...tags, tag]);
            };

            const addCustomTag = () => {
                if (newTag.trim() && !tags.includes(newTag.trim())) {
                    setTags([...tags, newTag.trim()]);
                    setNewTag('');
                }
            };

            return (
                <div className="max-w-3xl mx-auto">
                    <div className="bg-white rounded-xl shadow-lg p-8">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-3xl font-bold">⚡ Quick Capture</h2>
                            <button
                                onClick={() => setCurrentView('dashboard')}
                                className="text-gray-600 hover:text-gray-800"
                            >
                                <i className="fas fa-times text-2xl"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div>
                                <label className="block text-sm font-semibold mb-2">Webinar Title/Topic *</label>
                                <input
                                    type="text"
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    placeholder="e.g., How to boost email open rates with Mago"
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    required
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-semibold mb-2">Quick Description</label>
                                <textarea
                                    value={description}
                                    onChange={(e) => setDescription(e.target.value)}
                                    placeholder="What's this about? Key points to cover..."
                                    rows="4"
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                />
                            </div>

                            <div>

        function AIGenerator({ onAdd, setCurrentView, availableTags }) {
            const [prompt, setPrompt] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [generatedIdeas, setGeneratedIdeas] = useState([]);
            const [error, setError] = useState('');

            const handleGenerate = async () => {
                if (!prompt.trim()) return;

                setIsGenerating(true);
                setError('');

                try {
                    const fullPrompt = `You are helping David Farr, the Marketing Automation Wizard, come up with webinar ideas for his "Amazing Mago Monthly Mastery" series. Mago is a marketing automation CRM specifically for magicians and performers.

Context: ${prompt}

Generate 5 specific webinar topic ideas that would be valuable for magicians using the Mago CRM. Each idea should be actionable and focused on helping them book more shows or use Mago more effectively.

Respond ONLY with a JSON array in this exact format (no markdown, no preamble):
[
  {
    "title": "Webinar title here",
    "description": "2-3 sentence description of what this webinar would cover"
  }
]`;

                    const formData = new URLSearchParams();
                    formData.append('action', 'callClaude');
                    formData.append('prompt', fullPrompt);

                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (data.error) {
                        setError('Failed to generate ideas: ' + data.error);
                        return;
                    }

                    const textContent = data.content?.find(item => item.type === 'text')?.text || '';
                    
                    // Clean up any markdown backticks
                    const cleanText = textContent.replace(/```json|```/g, '').trim();
                    const ideas = JSON.parse(cleanText);

                    const formattedIdeas = ideas.map(idea => ({
                        ...idea,
                        source: 'AI Generated',
                        tags: ['AI Generated', 'Mago CRM']
                    }));

                    setGeneratedIdeas(formattedIdeas);
                } catch (err) {
                    console.error('AI Generation error:', err);
                    setError('Failed to generate ideas. Please try again.');
                } finally {
                    setIsGenerating(false);
                }
            };

            const saveIdea = (idea) => {
                onAdd(idea);
                setGeneratedIdeas(generatedIdeas.filter(i => i !== idea));
            };

            const saveAllIdeas = () => {
                generatedIdeas.forEach(idea => onAdd(idea));
                alert(`${generatedIdeas.length} ideas saved!`);
                setCurrentView('all-ideas');
            };

            return (
                <div className="max-w-4xl mx-auto">
                    <div className="bg-white rounded-xl shadow-lg p-8">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-3xl font-bold">🤖 AI Idea Generator</h2>
                            <button
                                onClick={() => setCurrentView('dashboard')}
                                className="text-gray-600 hover:text-gray-800"
                            >
                                <i className="fas fa-times text-2xl"></i>
                            </button>
                        </div>

                        <p className="text-gray-600 mb-6">
                            Tell Claude what's on your mind, and get 5 tailored webinar ideas instantly.
                        </p>

                        <div className="mb-6">
                            <label className="block text-sm font-semibold mb-2">What should Claude know?</label>
                            <textarea
                                value={prompt}
                                onChange={(e) => setPrompt(e.target.value)}
                                rows="6"
                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                placeholder="e.g., We just released a new SMS automation feature. Inner Circle members keep asking about how to write better follow-up emails. I want to show them how to use the templates..."
                            />
                        </div>

                        {error && (
                            <div className="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700">
                                {error}
                            </div>
                        )}

                        <button
                            onClick={handleGenerate}
                            disabled={isGenerating || !prompt.trim()}
                            className="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-4 rounded-lg font-bold text-lg hover:from-purple-700 hover:to-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            {isGenerating ? '🎩 Claude is thinking...' : '✨ Generate Ideas with AI'}
                        </button>

                        {generatedIdeas.length > 0 && (
                            <div className="mt-8">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-2xl font-bold">Generated Ideas</h3>
                                    <button
                                        onClick={saveAllIdeas}
                                        className="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700"
                                    >
                                        Save All
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    {generatedIdeas.map((idea, index) => (
                                        <div key={index} className="border border-gray-200 rounded-lg p-4">
                                            <div className="flex justify-between items-start">
                                                <div className="flex-1">
                                                    <h4 className="font-bold text-lg mb-2">{idea.title}</h4>
                                                    <p className="text-gray-600 text-sm">{idea.description}</p>
                                                </div>
                                                <button
                                                    onClick={() => saveIdea(idea)}
                                                    className="ml-4 bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600"
                                                >
                                                    Save
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function BulkImport({ onImport, setCurrentView }) {
            const [jsonText, setJsonText] = useState('');
            const [error, setError] = useState('');
            const [preview, setPreview] = useState(null);

            const handlePaste = (text) => {
                setJsonText(text);
                setError('');
                
                try {
                    const data = JSON.parse(text);
                    const ideas = data.ideas || (Array.isArray(data) ? data : []);
                    
                    if (ideas.length === 0) {
                        setError('No ideas found in JSON');
                        return;
                    }
                    
                    setPreview({
                        count: ideas.length,
                        samples: ideas.slice(0, 5)
                    });
                } catch (e) {
                    setError('Invalid JSON format: ' + e.message);
                }
            };

            const handleImport = () => {
                try {
                    const data = JSON.parse(jsonText);
                    const ideas = data.ideas || (Array.isArray(data) ? data : []);
                    
                    const formattedIdeas = ideas.map(idea => ({
                        title: idea.title,
                        description: idea.description,
                        source: idea.source || 'Bulk Import',
                        tags: idea.tags || [],
                        notes: idea.priority ? `Priority: ${idea.priority}` : ''
                    }));
                    
                    onImport(formattedIdeas);
                } catch (e) {
                    setError('Import failed: ' + e.message);
                }
            };

            return (
                <div className="max-w-4xl mx-auto">
                    <div className="bg-white rounded-xl shadow-lg p-8">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-3xl font-bold">📥 Bulk Import Ideas</h2>
                            <button
                                onClick={() => setCurrentView('dashboard')}
                                className="text-gray-600 hover:text-gray-800"
                            >
                                <i className="fas fa-times text-2xl"></i>
                            </button>
                        </div>

                        <div className="mb-6">
                            <label className="block text-sm font-semibold mb-2">JSON Data</label>
                            <textarea
                                value={jsonText}
                                onChange={(e) => handlePaste(e.target.value)}
                                rows="12"
                                className="w-full px-4 py-3 border border-gray-300 rounded-lg font-mono text-sm"
                                placeholder="Paste your JSON here..."
                            />
                        </div>

                        {error && (
                            <div className="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700">
                                {error}
                            </div>
                        )}

                        {preview && (
                            <div className="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg">
                                <div className="font-bold text-green-800 mb-2">
                                    ✓ Ready to import {preview.count} ideas
                                </div>
                            </div>
                        )}

                        <button
                            onClick={handleImport}
                            disabled={!preview}
                            className="w-full bg-orange-600 text-white py-4 rounded-lg font-bold text-lg hover:bg-orange-700 transition disabled:opacity-50"
                        >
                            {preview ? `Import & Sync ${preview.count} Ideas` : 'Paste JSON to Preview'}
                        </button>
                    </div>
                </div>
            );
        }

        function ManageTags({ availableTags, onDeleteTag, onAddTag, setCurrentView }) {
            const [newTagName, setNewTagName] = useState('');

            const handleAddTag = () => {
                if (newTagName.trim() && !availableTags.includes(newTagName.trim())) {
                    onAddTag(newTagName.trim());
                    setNewTagName('');
                    alert('Tag added! It will now appear everywhere.');
                } else if (availableTags.includes(newTagName.trim())) {
                    alert('This tag already exists!');
                }
            };

            return (
                <div className="max-w-4xl mx-auto">
                    <div className="bg-white rounded-xl shadow-lg p-8">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-3xl font-bold">🏷️ Manage Tags</h2>
                            <button
                                onClick={() => setCurrentView('dashboard')}
                                className="text-gray-600 hover:text-gray-800"
                            >
                                <i className="fas fa-times text-2xl"></i>
                            </button>
                        </div>

                        <div className="mb-8">
                            <h3 className="text-xl font-bold mb-4">Add New Tag</h3>
                            <div className="flex flex-col sm:flex-row gap-3">
                                <input
                                    type="text"
                                    value={newTagName}
                                    onChange={(e) => setNewTagName(e.target.value)}
                                    placeholder="New tag name..."
                                    className="flex-1 px-4 py-3 border border-gray-300 rounded-lg"
                                    onKeyPress={(e) => e.key === 'Enter' && handleAddTag()}
                                />
                                <button
                                    onClick={handleAddTag}
                                    className="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 whitespace-nowrap"
                                >
                                    Add Tag
                                </button>
                            </div>
                        </div>

                        <div>
                            <h3 className="text-xl font-bold mb-4">All Tags ({availableTags.length})</h3>
                            <div className="flex flex-wrap gap-3">
                                {availableTags.map(tag => (
                                    <div
                                        key={tag}
                                        className="flex items-center gap-2 bg-gray-100 px-4 py-2 rounded-lg"
                                    >
                                        <span className="font-medium">{tag}</span>
                                        <button
                                            onClick={() => onDeleteTag(tag)}
                                            className="text-red-500 hover:text-red-700"
                                            title="Remove this tag from all ideas"
                                        >
                                            <i className="fas fa-times"></i>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="mt-8 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                            <p className="text-sm text-yellow-800">
                                <strong>Note:</strong> Deleting a tag will remove it from ALL ideas that currently use it. This action cannot be undone.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        function MigrateFromSheets({ onMigrate, setCurrentView }) {
            const OLD_URL = 'https://script.google.com/macros/s/AKfycbwnAXtnYjxwx7n00C_n8otIPyFkOhlCo7HFB_fpF1VKrBmnMi4Ho5a4vavqTvSUERDt/exec';
            const [appsScriptUrl, setAppsScriptUrl] = useState(OLD_URL);
            const [isFetching, setIsFetching] = useState(false);
            const [isMigrating, setIsMigrating] = useState(false);
            const [preview, setPreview] = useState(null);
            const [error, setError] = useState('');

            const fetchFromSheets = async () => {
                if (!appsScriptUrl.trim()) return;
                setIsFetching(true);
                setError('');
                setPreview(null);
                try {
                    const [ideasResp, webinarsResp, tagsResp] = await Promise.all([
                        fetch(`${appsScriptUrl}?action=getIdeas`),
                        fetch(`${appsScriptUrl}?action=getWebinars`),
                        fetch(`${appsScriptUrl}?action=getTags`)
                    ]);
                    const [ideasRows, webinarsRows, tagsRows] = await Promise.all([
                        ideasResp.json(), webinarsResp.json(), tagsResp.json()
                    ]);
                    const ideas = ideasRows.length > 1 ? ideasRows.slice(1).map(row => ({
                        id: row[0] || '',
                        title: row[1] || '',
                        description: row[2] || '',
                        source: row[3] || '',
                        tags: row[4] ? JSON.parse(row[4]) : [],
                        notes: row[5] || '',
                        status: row[6] || 'idea',
                        createdAt: row[7] || new Date().toISOString(),
                        priority: row[8] || '',
                        updatedAt: row[9] || new Date().toISOString()
                    })).filter(i => i.id) : [];
                    const webinars = webinarsRows.length > 1 ? webinarsRows.slice(1).map(row => ({
                        id: row[0] || '',
                        ideaId: row[1] || '',
                        date: row[2] || '',
                        title: row[3] || '',
                        isFlexible: row[4] === 'true'
                    })).filter(w => w.id) : [];
                    const tags = tagsRows.map(row => row[0]).filter(t => t);
                    setPreview({ ideas, webinars, tags });
                } catch (err) {
                    setError('Failed to fetch from Apps Script: ' + err.message);
                } finally {
                    setIsFetching(false);
                }
            };

            const handleMigrate = async () => {
                if (!preview) return;
                setIsMigrating(true);
                try {
                    const formData = new URLSearchParams();
                    formData.append('action', 'seedData');
                    formData.append('data', JSON.stringify(preview));
                    const response = await fetch(API_URL, { method: 'POST', body: formData });
                    if (!response.ok) throw new Error('Migration request failed');
                    const result = await response.json();
                    if (result.error) throw new Error(result.error);
                    onMigrate(preview.ideas, preview.webinars, preview.tags);
                    alert(`Migration complete! Imported ${result.imported.ideas} ideas, ${result.imported.webinars} webinars, ${result.imported.tags} tags.`);
                    setCurrentView('dashboard');
                } catch (err) {
                    setError('Migration failed: ' + err.message);
                } finally {
                    setIsMigrating(false);
                }
            };

            return (
                <div className="max-w-3xl mx-auto">
                    <div className="bg-white rounded-xl shadow-lg p-8">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-3xl font-bold">📦 Migrate from Google Sheets</h2>
                            <button onClick={() => setCurrentView('dashboard')} className="text-gray-600 hover:text-gray-800">
                                <i className="fas fa-times text-2xl"></i>
                            </button>
                        </div>
                        <p className="text-gray-600 mb-6">
                            One-time import of your existing Google Sheets data into Cloudflare KV. This will overwrite any data currently stored in Cloudflare.
                        </p>
                        <div className="mb-6">
                            <label className="block text-sm font-semibold mb-2">Google Apps Script URL</label>
                            <input
                                type="text"
                                value={appsScriptUrl}
                                onChange={(e) => setAppsScriptUrl(e.target.value)}
                                placeholder="https://script.google.com/macros/s/..."
                                className="w-full px-4 py-3 border border-gray-300 rounded-lg font-mono text-sm"
                            />
                        </div>
                        <button
                            onClick={fetchFromSheets}
                            disabled={isFetching || !appsScriptUrl.trim()}
                            className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 disabled:opacity-50 mb-6"
                        >
                            {isFetching ? 'Fetching from Google Sheets...' : 'Fetch Data from Google Sheets'}
                        </button>
                        {error && (
                            <div className="p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 mb-6">
                                {error}
                            </div>
                        )}
                        {preview && (
                            <div className="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg">
                                <div className="font-bold text-green-800 mb-3">Ready to import:</div>
                                <ul className="text-green-700 space-y-1 mb-4">
                                    <li>✓ {preview.ideas.length} ideas</li>
                                    <li>✓ {preview.webinars.length} scheduled webinars</li>
                                    <li>✓ {preview.tags.length} tags</li>
                                </ul>
                                <button
                                    onClick={handleMigrate}
                                    disabled={isMigrating}
                                    className="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 disabled:opacity-50"
                                >
                                    {isMigrating ? 'Migrating...' : `Migrate ${preview.ideas.length} Ideas to Cloudflare`}
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
